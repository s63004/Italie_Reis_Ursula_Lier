<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Super-Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 600: '#7c3aed', 700: '#6d28d9', 900: '#4c1d95' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-slate-800 font-sans flex flex-col">

    <div id="alertBox" class="hidden"></div>

    <div id="superLoginScreen" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.618 5.984A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016zM12 9v2m0 4h.01"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Systeembeheer</h1>
                <p class="text-sm text-slate-500 mt-2">Log in met het super-admin wachtwoord.</p>
            </div>

            <form id="superLoginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Master Wachtwoord</label>
                    <input type="password" id="sa_password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-slate-50" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl shadow-md hover:shadow-lg transition">Authenticeren</button>
            </form>
        </div>
    </div>

    <div id="superDashboardScreen" class="hidden flex-col flex-grow">
        <nav class="bg-brand-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3">
                        <svg class="w-6 h-6 text-brand-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <span class="text-lg font-bold tracking-wide">SaaS Beheercentrum</span>
                    </div>
                    <button onclick="window.superAdmin.logout()" class="text-sm bg-brand-800 hover:bg-brand-700 px-4 py-2 rounded-lg font-medium transition border border-brand-700">Afsluiten</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Aangesloten Scholen</h2>
                <p class="text-sm text-slate-500 mt-1">Beheer hier alle klant-omgevingen (tenants) die gebruik maken van het platform.</p>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-brand-500"></div>
                <h3 class="text-base font-bold text-slate-800 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Nieuwe Klant (School) Toevoegen
                </h3>
                <form id="addSchoolForm" class="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Officiële Schoolnaam</label>
                        <input type="text" id="s_naam" placeholder="Bv. Campus Sint-Ursula" class="w-full border border-slate-300 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Unieke URL (Slug)</label>
                        <input type="text" id="s_slug" placeholder="bv. ursula" class="w-full border border-slate-300 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Beheerder Wachtwoord</label>
                        <input type="password" id="s_wachtwoord" placeholder="Minimaal 6 tekens" class="w-full border border-slate-300 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none" required minlength="6">
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition">Genereren</button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
                    <h3 class="font-semibold text-slate-700 text-sm">Overzicht Actieve Tenants</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-left">
                        <thead class="bg-white">
                            <tr>
                                <th class="px-6 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider">Naam</th>
                                <th class="px-6 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider">URL Slug</th>
                                <th class="px-6 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider">Klant Sinds</th>
                                <th class="px-6 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider">Portaal</th>
                                <th class="px-6 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Beheer</th>
                            </tr>
                        </thead>
                        <tbody id="scholenTableBody" class="bg-white divide-y divide-slate-100 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/superadmin.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
