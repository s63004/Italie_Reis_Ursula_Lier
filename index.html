<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Kamerverdelingen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }
        .kamer-card { transition: all 0.2s ease-in-out; }
        .kamer-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .frozen-room { position: relative; }
        .frozen-overlay { border-radius: inherit; }
        .bg-overlay { background-color: rgba(248, 250, 252, 0.85); backdrop-filter: blur(12px); min-height: 100vh; position: fixed; inset: 0; z-index: -1; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col relative">
    
    <div class="bg-overlay"></div>

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center shadow-sm">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m3-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <div class="flex flex-col">
                        <span id="navTitle" class="text-lg font-bold text-slate-800 tracking-tight leading-tight">Laden...</span>
                        <span id="schoolSubTitle" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold"></span>
                    </div>
                    </div>
                <div class="flex items-center gap-5">
                    <div class="flex items-center gap-2 hidden sm:flex">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center border border-slate-200">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <span id="userInfo" class="font-medium text-sm text-slate-600"></span>
                    </div>
                    <button onclick="window.app.logout()" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5 bg-white hover:bg-slate-50 px-3 py-1.5 rounded-md border border-slate-200 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Uitloggen
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4 bg-white/70 p-6 rounded-2xl border border-white/50 shadow-sm backdrop-blur-md">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Kies je kamer</h1>
                <p class="text-slate-500 mt-1.5 text-sm">Selecteer een beschikbare plaats in het gewenste hotel.</p>
            </div>
            
            <div id="tabsContainer" class="inline-flex bg-slate-100/80 p-1.5 rounded-xl gap-1 border border-slate-200/50 backdrop-blur-sm shadow-inner overflow-x-auto max-w-full">
            </div>
        </div>

        <div id="alertBox" class="hidden"></div>
        <div id="cardOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

        <div id="kamersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-12">
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
