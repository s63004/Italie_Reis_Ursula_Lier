<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Systeem Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-shadow {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="glass-panel w-full max-w-md rounded-2xl p-8">
        <div class="text-center mb-8">
            <h1 id="loginMainTitle" class="text-3xl font-bold text-white mb-2 text-shadow tracking-tight">Laden...</h1>
            <p id="loginSubTitle" class="text-slate-300 text-sm font-medium tracking-wide uppercase"></p>
        </div>

        <div id="loginActions" class="space-y-4">
            <a id="smartschoolBtn" href="#" class="flex items-center justify-center w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3.5 px-6 rounded-lg shadow-sm transition border border-primary-500">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                Aanmelden via Smartschool
            </a>

            <button onclick="document.getElementById('devForm').classList.toggle('hidden')" class="flex items-center justify-center w-full bg-white/10 hover:bg-white/20 text-white font-medium py-3.5 px-6 rounded-lg border border-white/20 transition focus:outline-none text-sm">
                <svg class="w-4 h-4 mr-2 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                Alternatieve Toegang (Dev)
            </button>
        </div>

        <p class="text-xs text-slate-400 text-center mt-6">Beveiligde omgeving. Toegang wordt geregistreerd.</p>

        <div id="devForm" class="hidden mt-6 bg-white p-6 rounded-xl shadow-inner space-y-4">
            <h3 class="text-slate-800 font-bold text-sm border-b border-slate-100 pb-2 uppercase tracking-wider">Handmatige Authenticatie</h3>
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Voornaam</label>
                        <input type="text" id="dev_vnaam" placeholder="Voornaam" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Achternaam</label>
                        <input type="text" id="dev_naam" placeholder="Achternaam" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Geslacht (Volgens systeem)</label>
                    <select id="dev_geslacht" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none transition bg-white">
                        <option value="M">Mannelijk</option>
                        <option value="V">Vrouwelijk</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 p-3 bg-slate-50 rounded-lg border border-slate-200 mt-2">
                    <input type="checkbox" id="dev_isLeerkracht" class="w-4 h-4 rounded text-primary-600 focus:ring-primary-500 cursor-pointer" onchange="document.getElementById('dev_pw_container').classList.toggle('hidden')">
                    <label for="dev_isLeerkracht" class="text-sm text-slate-700 font-medium cursor-pointer select-none">Beheerdersaccount</label>
                </div>

                <div id="dev_pw_container" class="hidden pt-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Beheerderswachtwoord</label>
                    <input type="password" id="dev_pw" placeholder="••••••••" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none transition">
                </div>

                <div id="dev_error" class="hidden text-red-700 text-xs font-medium bg-red-50 p-3 rounded-lg border border-red-200"></div>

                <button onclick="devLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm py-3 rounded-lg shadow-sm transition mt-2">
                    Authenticeren
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>

    <script>
        let currentSchoolId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const schoolSlug = params.get('school');
            const reisSlug = params.get('reis'); 
            
            let schoolData = null;
            let reisData = null;

            if (schoolSlug) {
                schoolData = await window.dbApi.getSchoolBySlug(schoolSlug);
            }

            if (schoolData && reisSlug) {
                currentSchoolId = schoolData.id;
                reisData = await window.dbApi.getReisBySlug(reisSlug, schoolData.id);
            }

            if (reisData && schoolData) {
                document.body.style.backgroundImage = `url('${reisData.login_bg}')`;
                
                document.getElementById('loginMainTitle').innerText = reisData.naam;
                document.title = reisData.naam + " - Toegang";
                document.getElementById('loginSubTitle').innerText = schoolData.naam;

                localStorage.setItem('selected_trip_id', reisData.id);
                
                // Smartschool link updaten (geef school_id en reis_id mee via de URL voor de backend callback)
                document.getElementById('smartschoolBtn').href = `loginSS.php?aanmelden=1&school=${schoolData.id}&reis=${reisData.id}`;
            } else {
                document.getElementById('loginMainTitle').innerText = "Ongeldige Link";
                document.getElementById('loginSubTitle').innerText = "Controleer de URL of contacteer je beheerder.";
                document.getElementById('loginActions').classList.add('hidden');
            }
        });

        async function devLogin() {
            if (!currentSchoolId) {
                alert("Systeemfout: Geen school context gevonden in de URL.");
                return;
            }

            const vnaam = document.getElementById('dev_vnaam').value.trim();
            const naam = document.getElementById('dev_naam').value.trim();
            const geslacht = document.getElementById('dev_geslacht').value;
            const isLeerkracht = document.getElementById('dev_isLeerkracht').checked;
            const errorBox = document.getElementById('dev_error');

            errorBox.classList.add('hidden');

            if (!vnaam || !naam) {
                errorBox.innerText = "Voer alle verplichte velden in.";
                errorBox.classList.remove('hidden');
                return;
            }

            // AANGEPAST: Haal de huidige school/reis info op voor de sessie
            const params = new URLSearchParams(window.location.search);
            const schoolSlug = params.get('school');
            const reisSlug = params.get('reis');
            const schoolNaam = document.getElementById('loginSubTitle').innerText;
            const reisNaam = document.getElementById('loginMainTitle').innerText;
            const reisId = localStorage.getItem('selected_trip_id');

            try {
                if (isLeerkracht) {
                    const pw = document.getElementById('dev_pw').value;
                    const { data: isValid } = await window.dbApi.supabaseClient.rpc('verify_teacher_password', { p_password: pw, p_school_id: currentSchoolId });
                    
                    if (!isValid) {
                        errorBox.innerText = "Authenticatie mislukt.";
                        errorBox.classList.remove('hidden');
                        return;
                    }
                    // AANGEPAST: Geef de extra parameters door aan login()
                    await window.dbApi.login(naam, vnaam, geslacht, true, "dev_lk_" + Date.now(), currentSchoolId, schoolSlug, schoolNaam, reisId, reisSlug, reisNaam);
                    window.location.href = 'admin.html';
                } else {
                    const { data: alleLeerlingen } = await window.dbApi.supabaseClient
                        .from('persoon')
                        .select('*')
                        .eq('school_id', currentSchoolId)
                        .eq('rol', 'LEERLING');

                    const match = (alleLeerlingen || []).find(l => 
                        l.vnaam.toLowerCase() === vnaam.toLowerCase() && 
                        l.naam.toLowerCase() === naam.toLowerCase()
                    );

                    if (match) {
                        // AANGEPAST: Geef de extra parameters door aan login()
                        await window.dbApi.login(naam, vnaam, geslacht, false, match.id, currentSchoolId, schoolSlug, schoolNaam, reisId, reisSlug, reisNaam);
                        window.location.href = 'index.html';
                    } else {
                        errorBox.innerHTML = "Persoon niet gevonden in de database van deze school.";
                        errorBox.classList.remove('hidden');
                    }
                }
            } catch (err) {
                errorBox.innerText = "Er is een communicatiefout opgetreden.";
                errorBox.classList.remove('hidden');
                console.error(err);
            }
        }
    </script>
    </body>
</html>
