<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Kamerverdeling - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('vecteezy_colorful-village-of-manarola-in-cinque-terre-italy_33880836.jpg');
            background-size: cover;
            background-position: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 id="loginMainTitle" class="text-3xl font-bold text-white mb-2 shadow-sm">Laden...</h1>
            <p id="loginSubTitle" class="text-white/90 text-lg"></p>
        </div>

        <div class="space-y-4">
            <a href="loginSS.php?aanmelden=1" class="flex items-center justify-center w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                Inloggen via Smartschool
            </a>

            <button onclick="document.getElementById('devForm').classList.toggle('hidden')" class="flex items-center justify-center w-full bg-white/20 hover:bg-white/30 text-white font-bold py-4 px-6 rounded-xl border-2 border-white/40 shadow-lg transition transform hover:-translate-y-0.5 focus:outline-none">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                Handmatige Test-Login (Dev Mode)
            </button>
        </div>

        <p class="text-sm text-white/70 text-center mt-6">Gebruik de Smartschool knop voor de live-versie, of de Test-Login voor ontwikkeling.</p>

        <div id="devForm" class="hidden mt-6 bg-white/90 p-6 rounded-2xl shadow-inner space-y-4">
            <h3 class="text-gray-800 font-bold text-lg border-b pb-2">Test Gegevens</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Voornaam</label>
                    <input type="text" id="dev_vnaam" placeholder="Bijv. Lukas" class="w-full p-3 rounded-xl border border-gray-200 text-gray-800 focus:ring-2 focus:ring-orange-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Achternaam</label>
                    <input type="text" id="dev_naam" placeholder="Bijv. Peeters" class="w-full p-3 rounded-xl border border-gray-200 text-gray-800 focus:ring-2 focus:ring-orange-400 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Geslacht</label>
                    <select id="dev_geslacht" class="w-full p-3 rounded-xl border border-gray-200 text-gray-800 focus:ring-2 focus:ring-orange-400 focus:outline-none transition">
                        <option value="M">Jongen (M)</option>
                        <option value="V">Meisje (V)</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg">
                    <input type="checkbox" id="dev_isLeerkracht" class="w-4 h-4 rounded text-orange-500 focus:ring-orange-500 cursor-pointer" onchange="document.getElementById('dev_pw_container').classList.toggle('hidden')">
                    <label for="dev_isLeerkracht" class="text-sm text-gray-700 font-semibold cursor-pointer">Ik ben leerkracht</label>
                </div>

                <div id="dev_pw_container" class="hidden">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Admin Wachtwoord</label>
                    <input type="password" id="dev_pw" placeholder="Wachtwoord" class="w-full p-3 rounded-xl border border-gray-200 text-gray-800 focus:ring-2 focus:ring-orange-400 focus:outline-none transition">
                </div>

                <div id="dev_error" class="hidden text-red-700 text-xs font-bold bg-red-50 p-3 rounded-xl border border-red-200"></div>

                <button onclick="devLogin()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                    Nu Inloggen
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const settings = await window.dbApi.getAppSettings();
            if (settings.app_title) {
                document.getElementById('loginMainTitle').innerText = settings.app_title;
                document.title = settings.app_title + " - Login";
            }
            if (settings.school_name) {
                document.getElementById('loginSubTitle').innerText = settings.school_name;
            }
        });

        async function devLogin() {
            const vnaam = document.getElementById('dev_vnaam').value.trim();
            const naam = document.getElementById('dev_naam').value.trim();
            const geslacht = document.getElementById('dev_geslacht').value;
            const isLeerkracht = document.getElementById('dev_isLeerkracht').checked;
            const errorBox = document.getElementById('dev_error');

            errorBox.classList.add('hidden');

            if (!vnaam || !naam) {
                errorBox.innerText = "Vul a.u.b. beide namen in.";
                errorBox.classList.remove('hidden');
                return;
            }

            try {
                if (isLeerkracht) {
                    const pw = document.getElementById('dev_pw').value;
                    const isValid = await window.dbApi.verifyTeacherPassword(pw);
                    if (!isValid) {
                        errorBox.innerText = "Fout wachtwoord.";
                        errorBox.classList.remove('hidden');
                        return;
                    }
                    await window.dbApi.login(naam, vnaam, geslacht, true, "dev_lk_" + Date.now());
                    window.location.href = 'admin.html';
                } else {
                    const alleLeerlingen = await window.dbApi.getAllLeerlingen();
                    const match = alleLeerlingen.find(l => 
                        l.vnaam.toLowerCase() === vnaam.toLowerCase() && 
                        l.naam.toLowerCase() === naam.toLowerCase()
                    );

                    if (match) {
                        await window.dbApi.login(naam, vnaam, geslacht, false, match.id);
                        window.location.href = 'index.html';
                    } else {
                        errorBox.innerHTML = "Naam niet gevonden in de lijst.<br>Tip: Gebruik 'Lukas' 'Peeters'.";
                        errorBox.classList.remove('hidden');
                    }
                }
            } catch (err) {
                errorBox.innerText = "Database fout.";
                errorBox.classList.remove('hidden');
            }
        }
    </script>
    <script>
        // Laad de actieve reis in zodra de pagina start
        document.addEventListener('DOMContentLoaded', async () => {
            // Haal de actieve reis op uit de database
            const reizen = await window.dbApi.getReizen(true); 
            
            if (reizen && reizen.length > 0) {
                const actieveReis = reizen[0];
                
                // Pas de achtergrond aan
                document.getElementById('bgImage').src = actieveReis.login_bg;
                
                // Pas eventueel de titel aan (als je die id='hoofdTitle' geeft in je HTML)
                const titleEl = document.getElementById('hoofdTitle');
                if (titleEl) titleEl.innerText = actieveReis.naam;
            }
        });
    </script>
</body>
</html>
